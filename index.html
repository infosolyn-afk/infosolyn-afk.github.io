<style>
/* Tipografías SOLYN autoalojadas */
@font-face { font-family: 'Bebas Neue'; font-weight: 400; font-display: swap; src: url("fonts/bebas-neue-400-latin.woff2") format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+2000-206F, U+20AC, U+2122; }
@font-face { font-family: 'Bebas Neue'; font-weight: 400; font-display: swap; src: url("fonts/bebas-neue-400-latin-ext.woff2") format('woff2'); unicode-range: U+0100-02BA, U+1E00-1EFF; }
@font-face { font-family: 'Syne'; font-weight: 400 800; font-display: swap; src: url("fonts/syne-latin.woff2") format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+2000-206F, U+20AC, U+2122; }
@font-face { font-family: 'Syne'; font-weight: 400 800; font-display: swap; src: url("fonts/syne-latin-ext.woff2") format('woff2'); unicode-range: U+0100-02BA, U+1E00-1EFF; }
@font-face { font-family: 'DM Mono'; font-weight: 300; font-display: swap; src: url("fonts/dm-mono-300-latin.woff2") format('woff2'); }
@font-face { font-family: 'DM Mono'; font-weight: 400; font-display: swap; src: url("fonts/dm-mono-400-latin.woff2") format('woff2'); }
@font-face { font-family: 'DM Mono'; font-weight: 500; font-display: swap; src: url("fonts/dm-mono-500-latin.woff2") format('woff2'); }

:root {
  --bg: #F5F1EA; --surface: #ECE6DB; --surface-2: #E2DACB; --ink: #1A1715; --sec: #5C544C; --muted: #8C8278;
  --accent: #F26B1F; --hot: #FF8A1F; --deep: #C44A0F; --line: rgba(26,23,21,0.12); --line-soft: rgba(26,23,21,0.08);
  --dark: #1A1715; --cream: #F5F1EA; --line-dark: rgba(245,241,234,0.12);
  --display: 'Bebas Neue', Impact, sans-serif; --body: 'Syne', 'Helvetica Neue', sans-serif; --mono: 'DM Mono', 'Courier New', monospace;
  --container: 1400px;
}
* { box-sizing: border-box; }
html { overflow-x: hidden; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-weight: 300; font-size: 17px; line-height: 1.8; -webkit-font-smoothing: antialiased; overflow-x: clip; }
a { color: inherit; text-decoration: none; }
img { max-width: 100%; display: block; }
::selection { background: var(--accent); color: var(--cream); }
.container { max-width: var(--container); margin: 0 auto; padding-left: max(52px, env(safe-area-inset-left, 0px)); padding-right: max(52px, env(safe-area-inset-right, 0px)); }
.label { font-family: var(--mono); font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: var(--muted); }
.dark .label { color: var(--accent); }
h1, h2, h3 { margin: 0; }
h2.big { font-family: var(--display); font-size: clamp(56px, 8vw, 100px); line-height: 0.9; letter-spacing: 0.5px; text-transform: uppercase; color: var(--ink); }
h2.big em, h1 em { font-style: normal; color: var(--accent); }
h2.big .muted { color: var(--muted); }
.dark h2.big { color: var(--cream); }
.sub { font-family: var(--body); font-weight: 300; font-size: 18px; line-height: 1.7; color: var(--sec); }
.dark .sub { color: rgba(245,241,234,0.72); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; background: var(--ink); color: var(--cream); border: 0; font-family: var(--body); font-weight: 500; font-size: 15px; padding: 18px 28px; border-radius: 4px; cursor: pointer; white-space: nowrap; transition: transform 300ms cubic-bezier(.16,1,.3,1), background 200ms; }
.btn:hover { background: #2a2521; }
.btn.accent { background: var(--accent); color: var(--ink); }
.btn.accent:hover { background: var(--hot); }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.dark .btn.ghost { color: var(--cream); border-color: var(--line-dark); }
.textlink { font-family: var(--body); font-weight: 400; font-size: 13px; color: var(--sec); transition: color 180ms; }
.textlink:hover { color: var(--accent); }
.card { background: var(--bg); border: 1px solid var(--line); border-radius: 16px; padding: 36px 32px; position: relative; overflow: hidden; transform-style: preserve-3d; transition: background 400ms, transform 500ms cubic-bezier(.16,1,.3,1); }
.card .bar { position: absolute; top: 0; left: 0; height: 3px; width: 100%; background: var(--accent); transform-origin: left; transform: scaleX(0); transition: transform 500ms cubic-bezier(.16,1,.3,1); }
.card:hover { background: rgba(242,107,31,0.06); }
.card:hover .bar { transform: scaleX(1); }
.dark .card { background: rgba(245,241,234,0.04); border-color: rgba(245,241,234,0.08); }
.dark .card:hover { background: rgba(242,107,31,0.10); }
section { padding: 150px 0; border-bottom: 1px solid var(--line-soft); }
.dark { background: var(--dark); color: var(--cream); border-color: rgba(245,241,234,0.08); }
.surface { background: var(--surface); }
.placeholder { outline: 1px dashed rgba(242,107,31,0.45); outline-offset: 4px; position: relative; }
.placeholder::after { content: attr(data-ph); position: absolute; top: -10px; right: 12px; font-family: var(--mono); font-size: 9px; letter-spacing: 2px; text-transform: uppercase; color: var(--accent); background: var(--bg); padding: 2px 8px; border-radius: 4px; }
.dark .placeholder::after { background: var(--dark); }
.rv { opacity: 0; transform: translateY(40px); transition: opacity 900ms cubic-bezier(.16,1,.3,1), transform 900ms cubic-bezier(.16,1,.3,1); }
.rv.in { opacity: 1; transform: none; }
.rv.d1 { transition-delay: 100ms; } .rv.d2 { transition-delay: 200ms; } .rv.d3 { transition-delay: 300ms; } .rv.d4 { transition-delay: 400ms; }

/* nav */
.nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; display: flex; align-items: center; justify-content: space-between; padding: 14px 52px; background: transparent; border-bottom: 1px solid transparent; transition: background 400ms cubic-bezier(.16,1,.3,1), border-color 400ms; }
.nav.scrolled { background: rgba(245,241,234,0.85); backdrop-filter: blur(28px) saturate(140%); -webkit-backdrop-filter: blur(28px) saturate(140%); border-bottom-color: var(--line-soft); }
.nav .logo img { height: 38px; }
.nav .right { display: flex; align-items: center; gap: 28px; }
.nav .links { display: flex; align-items: center; gap: 28px; }
.nav .links a { font-family: var(--mono); font-size: 10px; letter-spacing: 3px; text-transform: uppercase; color: var(--sec); transition: color 180ms; white-space: nowrap; }
.nav .links a:hover { color: var(--accent); }
.nav .divider { width: 1px; height: 14px; background: rgba(26,23,21,0.15); }
.lang { display: inline-flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 10px; letter-spacing: 2.5px; text-transform: uppercase; color: rgba(26,23,21,0.45); }
.lang button { background: none; border: 0; color: inherit; font: inherit; letter-spacing: inherit; cursor: pointer; padding: 4px 2px; transition: color 180ms; }
.lang button:hover { color: var(--ink); }
.lang button.on { color: var(--accent); cursor: default; }
.dark .lang { color: rgba(245,241,234,0.55); } .dark .lang button:hover { color: var(--cream); }
.nav .btn { font-size: 13px; padding: 12px 22px; }

/* hero */
.hero { min-height: 100vh; position: relative; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; padding: 110px 0 52px; background: var(--bg); background-image: linear-gradient(to right, rgba(26,23,21,0.04) 1px, transparent 1px), linear-gradient(to bottom, rgba(26,23,21,0.04) 1px, transparent 1px); background-size: 64px 64px; border-bottom: 0; }
.hero .ghost { position: absolute; left: 0; right: 0; top: 20%; font-family: var(--display); font-size: clamp(140px, 20vw, 260px); line-height: 0.9; letter-spacing: 0.5px; text-transform: uppercase; color: rgba(26,23,21,0.05); white-space: nowrap; text-align: center; pointer-events: none; user-select: none; will-change: transform; }
.sphere { position: absolute; right: 2vw; top: 12vh; width: clamp(260px, 27vw, 400px); height: clamp(260px, 27vw, 400px); pointer-events: none; will-change: transform; z-index: 1; }
.sphere .fallback { width: 100%; height: 100%; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #FFB347 0%, #F26B1F 45%, #C44A0F 80%, transparent 100%); filter: blur(2px); display: none; }
.sphere.no3d .fallback { display: block; }
.hero .content { position: relative; z-index: 2; }
.chip { display: inline-flex; align-items: center; gap: 12px; margin-bottom: 28px; font-family: var(--mono); font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: var(--sec); border: 1px solid rgba(26,23,21,0.18); border-radius: 999px; padding: 10px 18px; background: rgba(245,241,234,0.7); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); display: inline-block; flex-shrink: 0; }
.hero h1 { font-family: var(--display); font-size: clamp(64px, 9vw, 150px); line-height: 0.87; letter-spacing: 0.5px; text-transform: uppercase; color: var(--ink); perspective: 1000px; display: flex; flex-direction: column; align-items: flex-start; }
.hero .bottom { display: flex; align-items: flex-end; justify-content: space-between; gap: 40px; padding-top: 40px; margin-top: 40px; border-top: 1px solid var(--line); flex-wrap: wrap; }
.hero .body { max-width: 520px; margin: 0; }
.hero .ctacol { display: flex; flex-direction: column; align-items: flex-end; gap: 14px; }
.hero .ctarow { display: flex; align-items: center; gap: 24px; flex-wrap: wrap; }
.hero .note { font-family: var(--mono); font-size: 11px; letter-spacing: 1px; color: var(--muted); text-align: right; }
.proof { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; margin-top: 52px; background: var(--line); border: 1px solid var(--line); }
.proof div b { font-weight: 600; margin-right: 4px; }
.proof div { background: var(--bg); padding: 18px 22px; font-family: var(--body); font-weight: 400; font-size: 14px; color: var(--ink); display: flex; align-items: center; gap: 12px; }

/* marquee */
.marquee { background: var(--dark); border-top: 1px solid rgba(245,241,234,0.08); border-bottom: 1px solid rgba(245,241,234,0.08); overflow: hidden; padding: 22px 0; }
.marquee .track { display: flex; gap: 40px; white-space: nowrap; width: max-content; will-change: transform; }
.marquee .track span { font-family: var(--mono); font-size: 11px; letter-spacing: 3.5px; text-transform: uppercase; color: var(--cream); display: inline-flex; align-items: center; gap: 40px; }
.marquee .track span i { color: var(--accent); font-style: normal; }

/* video */
.vsl { text-align: center; padding: 120px 0 100px; }
.vsl .label { display: block; margin-bottom: 32px; }
.vcard { position: relative; max-width: 1100px; margin: 0 auto; aspect-ratio: 16 / 9; border-radius: 18px; overflow: hidden; background: #221d19; border: 1px solid rgba(245,241,234,0.1); box-shadow: 0 40px 100px rgba(0,0,0,0.45); }
.vcard .cover { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; cursor: pointer; background: radial-gradient(ellipse at 50% 85%, rgba(242,107,31,0.4), rgba(242,107,31,0.08) 40%, transparent 65%), linear-gradient(180deg, #24201b, #15120f); }
.vcard .cover img { height: 28px; opacity: 0.9; }
.vcard .cover h3 { font-family: var(--display); font-size: clamp(40px, 5vw, 72px); line-height: 0.95; letter-spacing: 0.5px; text-transform: uppercase; color: var(--cream); }
.play { width: 104px; height: 104px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #FFB347 0%, #F26B1F 60%, #C44A0F 100%); border: 0; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 14px rgba(242,107,31,0.18), 0 20px 50px rgba(196,74,15,0.4); transition: transform 300ms cubic-bezier(.16,1,.3,1); }
.play:hover { transform: scale(1.08); }
.play::after { content: ""; width: 0; height: 0; border-top: 17px solid transparent; border-bottom: 17px solid transparent; border-left: 28px solid #1A1715; margin-left: 7px; }
.avatars { display: flex; justify-content: center; margin-top: 8px; }
.avatars .av { width: 50px; height: 50px; border-radius: 50%; border: 2px solid var(--accent); background: #2a2420; margin-left: -10px; display: flex; align-items: center; justify-content: center; font-family: var(--mono); font-size: 13px; color: rgba(245,241,234,0.8); box-shadow: 0 0 0 2px #1a1612; }
.avatars a { display: block; margin-left: -10px; border-radius: 50%; transition: transform 300ms cubic-bezier(.16,1,.3,1); } .avatars a:first-child { margin-left: 0; } .avatars a:hover { transform: translateY(-3px); z-index: 2; position: relative; } .avatars a .av { margin-left: 0; }
.avatars .av:first-child { margin-left: 0; }
.avatars img.av { object-fit: cover; }
.vcard .words { font-family: var(--body); font-weight: 500; font-size: 15px; color: var(--cream); }
.vcard .words i { font-style: normal; color: var(--accent); }
.vcard video { position: absolute; inset: 0; width: 100%; height: 100%; display: none; background: #000; }
.vcard.playing .cover { display: none; } .vcard.playing video { display: block; }
.vsl .or { margin-top: 28px; font-family: var(--body); font-weight: 300; font-size: 15px; color: rgba(245,241,234,0.7); display: flex; gap: 10px; justify-content: center; align-items: center; flex-wrap: wrap; }
.vsl .or a { font-family: var(--mono); font-size: 14px; color: var(--cream); border-bottom: 1px solid var(--accent); padding-bottom: 2px; }

/* logos */
.logos { text-align: center; padding: 100px 0; }
.logos h2 { font-family: var(--mono); font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: var(--muted); margin-bottom: 44px; }
.logowall { overflow: hidden; mask-image: linear-gradient(to right, transparent, #000 10%, #000 90%, transparent); -webkit-mask-image: linear-gradient(to right, transparent, #000 10%, #000 90%, transparent); }
.logowall .track { display: flex; gap: 80px; width: max-content; animation: slide 30s linear infinite; }
.logowall .track span { font-family: var(--display); font-size: 40px; letter-spacing: 1px; color: rgba(26,23,21,0.28); white-space: nowrap; }
@keyframes slide { from { transform: translateX(0); } to { transform: translateX(-50%); } }

/* testimonials */
.testi .label { display: block; text-align: center; margin-bottom: 40px; }
.featured { max-width: 860px; margin: 0 auto; text-align: center; }
.featured blockquote { margin: 0; font-family: var(--body); font-weight: 500; font-size: clamp(22px, 2.4vw, 32px); line-height: 1.4; color: var(--ink); }
.dark .featured blockquote { color: var(--cream); }
.person { display: flex; align-items: center; justify-content: center; gap: 14px; margin-top: 28px; }
.person .av { width: 52px; height: 52px; border-radius: 50%; background: var(--ink); color: var(--cream); display: flex; align-items: center; justify-content: center; font-family: var(--mono); font-size: 14px; flex-shrink: 0; }
.dark .person .av { background: var(--cream); color: var(--ink); }
.person img.av { object-fit: cover; display: block; background: var(--surface-2); }
.person .who { text-align: left; }
.person .name { font-family: var(--body); font-weight: 600; font-size: 15px; display: flex; align-items: center; gap: 8px; }
.person .name .li { display: inline-flex; width: 18px; height: 18px; color: var(--muted); transition: color 180ms, transform 300ms cubic-bezier(.16,1,.3,1); }
.person .name .li:hover { color: #0A66C2; transform: translateY(-1px); }
.person .name .li svg { width: 14px; height: 14px; }
.person .role { font-family: var(--mono); font-size: 11px; letter-spacing: 1px; color: var(--muted); }
.tgrid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 24px; margin-top: 56px; }
.tcard { display: flex; flex-direction: column; justify-content: space-between; gap: 28px; }
.tcard p { margin: 0; font-family: var(--body); font-weight: 300; font-size: 17px; line-height: 1.7; color: var(--sec); }
.tcard p b { color: var(--ink); font-weight: 600; }
.dark .tcard p { color: rgba(245,241,234,0.75); } .dark .tcard p b { color: var(--cream); }
.tcard .person { justify-content: flex-start; margin-top: 0; }

/* why / how */
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; margin-top: 72px; }
.why .icon { width: 48px; height: 48px; border-radius: 50%; border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; margin-bottom: 24px; color: var(--accent); }
.why .icon svg { width: 22px; height: 22px; }
.why h3, .how h3 { font-family: var(--display); font-size: clamp(30px, 3.2vw, 44px); line-height: 1; letter-spacing: 0.5px; text-transform: uppercase; color: var(--ink); margin: 0 0 12px; }
.why p, .how p { margin: 0; font-family: var(--body); font-weight: 300; font-size: 16px; line-height: 1.75; color: var(--sec); }
.how .steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; margin-top: 72px; background: var(--line); border: 1px solid var(--line); }
.how .step { background: var(--bg); padding: 40px 32px 44px; }
.how .num { font-family: var(--display); font-size: 88px; line-height: 0.85; color: var(--accent); letter-spacing: -0.02em; text-shadow: 4px 4px 0 var(--ink); margin-bottom: 14px; }

/* audit (dark) */
.audit { position: relative; overflow: hidden; }
.audit .ghost { position: absolute; right: -20px; bottom: -60px; font-family: var(--display); font-size: clamp(160px, 20vw, 240px); line-height: 0.9; letter-spacing: 0.5px; text-transform: uppercase; color: rgba(242,107,31,0.08); white-space: nowrap; pointer-events: none; user-select: none; will-change: transform; }
.audit .inner { position: relative; max-width: 1000px; margin: 0 auto; }
.acc { margin-top: 56px; border-bottom: 1px solid var(--line-dark); }
.acc .it { border-top: 1px solid var(--line-dark); transition: background 300ms; }
.acc .it.open { background: rgba(242,107,31,0.08); }
.acc button { width: 100%; text-align: left; background: transparent; border: 0; cursor: pointer; padding: 26px 24px; display: grid; grid-template-columns: 48px 1fr 28px; gap: 18px; align-items: center; color: var(--cream); }
.acc button .n { font-family: var(--mono); font-size: 11px; letter-spacing: 2px; color: var(--muted); }
.acc button .q { font-family: var(--body); font-weight: 600; font-size: 20px; line-height: 1.35; }
.acc button .chev { font-family: var(--mono); font-size: 18px; color: var(--accent); text-align: center; transition: transform 300ms cubic-bezier(.16,1,.3,1); }
.acc .it.open .chev { transform: rotate(45deg); }
.acc .a { max-height: 0; overflow: hidden; transition: max-height 500ms cubic-bezier(.16,1,.3,1); }
.acc .a p { margin: 0; padding: 0 24px 28px 90px; font-family: var(--body); font-weight: 300; font-size: 16px; line-height: 1.75; color: rgba(245,241,234,0.72); max-width: 820px; }
.acc .a p b { color: var(--cream); }
.acc .it.open .a { max-height: 300px; }
.audit .close { margin-top: 56px; padding: 44px 40px; border-radius: 16px; background: var(--cream); color: var(--ink); display: flex; justify-content: space-between; align-items: center; gap: 32px; flex-wrap: wrap; }
.audit .close h3 { font-family: var(--display); font-size: clamp(36px, 4vw, 56px); line-height: 0.95; letter-spacing: 0.5px; text-transform: uppercase; margin: 0 0 12px; }
.audit .close p { margin: 0; font-family: var(--body); font-weight: 300; font-size: 16px; color: var(--sec); line-height: 1.7; max-width: 520px; }

/* final cta */
.final { text-align: center; position: relative; overflow: hidden; padding: 180px 0 160px; }
.final .glow { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); width: 900px; height: 900px; max-width: 100vw; background: radial-gradient(circle, rgba(242,107,31,0.22) 0%, transparent 60%); pointer-events: none; animation: breathe 6s ease-in-out infinite; }
@keyframes breathe { 0%,100% { transform: translate(-50%,-50%) scale(1); opacity: 1; } 50% { transform: translate(-50%,-50%) scale(1.12); opacity: 0.75; } }
.final .inner { position: relative; max-width: 1100px; margin: 0 auto; }
.final .labelrow { display: flex; align-items: center; gap: 20px; justify-content: center; margin-bottom: 52px; }
.final .labelrow i { flex: 1; max-width: 80px; height: 1px; background: rgba(26,23,21,0.15); }
.final h2 em { font-style: normal; color: var(--accent); }
.final h2 { font-family: var(--display); font-size: clamp(64px, 9.5vw, 132px); line-height: 0.95; letter-spacing: 0.5px; text-transform: uppercase; color: var(--ink); }
.final .sub { max-width: 640px; margin: 56px auto 0; }
.final .btn { margin-top: 44px; padding: 20px 32px; }
.final .links { margin-top: 24px; font-family: var(--mono); font-size: 13px; letter-spacing: 0.5px; color: var(--sec); display: flex; gap: 18px; justify-content: center; flex-wrap: wrap; }
.final .links a { color: var(--ink); border-bottom: 1px solid var(--accent); padding-bottom: 2px; }

/* footer */
footer { background: var(--dark); color: var(--cream); padding: 80px 0 40px; border-top: 1px solid rgba(245,241,234,0.08); }

    lm_f1: 'First name', lm_f2: 'Last name', lm_f3: 'Email', lm_f4: 'Phone', lm_p1: 'John', lm_p2: 'Doe', lm_p3: 'john@company.com', lm_p4: '+1 (555) 123-4567',
    lm_btn: 'Download the Playbook', lm_sending: 'Sending…', lm_foot: 'No spam. By downloading you accept our <a href="privacidad.html" target="_blank">privacy policy</a>.',
    lm_done_t: 'Done! Your playbook <em>is downloading.</em>', lm_done_d: 'If the download didn\'t start, tap the button. And if you\'d rather have us do it for you, book a 30-minute demo.',

const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const isMobile = window.innerWidth < 900;
function detectLang() {
  try { const s = localStorage.getItem('solyn_lang'); if (s === 'en' || s === 'es') return s; } catch (e) {}
  try { const l = (navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || '']); if (l.some(x => String(x).toLowerCase().startsWith('es'))) return 'es'; } catch (e) {}
  return 'en';
}
let lang = detectLang(); let split = null;
function apply() {
  const d = I18N[lang];
  document.documentElement.lang = lang;
  if (split) { split.revert(); split = null; }
  document.querySelectorAll('[data-i]').forEach(el => { el.innerHTML = d[el.dataset.i] ?? el.dataset.i; });
  document.querySelectorAll('[data-ph-i]').forEach(el => { el.placeholder = d[el.dataset.phI]; });
  document.querySelectorAll('.lang button').forEach(b => b.classList.toggle('on', b.dataset.lang === lang));
  document.getElementById('mtrack').innerHTML = [0, 1].map(() => d.marquee.map(x => `<span>${x} <i>✦</i></span>`).join('')).join('');
  const lt = document.getElementById('logotrack'); if (lt) lt.innerHTML = [...d.logos, ...d.logos].map(x => `<span>${x}</span>`).join('');
  document.getElementById('acc').innerHTML = d.audit.map((it, i) => `<div class="it${i === 0 ? ' open' : ''}"><button aria-expanded="${i === 0}"><span class="n">0${i + 1}</span><span class="q">${it[0]}</span><span class="chev">+</span></button><div class="a"><p>${it[1]}</p></div></div>`).join('');
  document.querySelectorAll('#acc button').forEach(b => b.addEventListener('click', () => { const it = b.parentElement; const open = it.classList.contains('open'); document.querySelectorAll('#acc .it').forEach(x => { x.classList.remove('open'); x.querySelector('button').setAttribute('aria-expanded', 'false'); }); if (!open) { it.classList.add('open'); b.setAttribute('aria-expanded', 'true'); } }));
  document.title = lang === 'es' ? 'SOLYN | Convertimos el email en ingresos' : 'SOLYN | We turn email into revenue';
  const dl = document.getElementById('lmdl'); dl.href = PDF[lang]; dl.setAttribute('download', PDF[lang].split('/').pop());
  const v = document.getElementById('player'); const vc = document.getElementById('vcard');
  vc.classList.remove('playing'); v.pause(); v.removeAttribute('src'); v.load(); v.dataset.src = `video/solyn-${lang}.mp4`; v.poster = `video/solyn-${lang}-poster.jpg`;
  // hero headline: split + reveal (como el sitio original)
  if (window.SplitType && window.gsap && !reduced) {
    const h1 = document.getElementById('h1');
    split = new SplitType(h1, { types: 'chars,words' });
    gsap.fromTo(split.chars, { y: '110%', rotateX: -75, opacity: 0 }, { y: 0, rotateX: 0, opacity: 1, duration: 1.1, ease: 'expo.out', stagger: 0.025, delay: 0.2 });
  }
}
document.querySelectorAll('.lang button').forEach(b => b.addEventListener('click', () => { lang = b.dataset.lang; try { localStorage.setItem('solyn_lang', lang); } catch (e) {} apply(); }));
apply();

// ---- motion (portado del sitio original): Lenis + ScrollTrigger + tilt + magnético + marquee + parallax
let lenis = null;
if (window.gsap && window.ScrollTrigger) gsap.registerPlugin(ScrollTrigger);
if (!reduced && window.Lenis) {
  lenis = new Lenis({ duration: 1.15, easing: t => Math.min(1, 1.001 - Math.pow(2, -10 * t)), smoothWheel: true, smoothTouch: false });
  if (window.ScrollTrigger) { lenis.on('scroll', ScrollTrigger.update); gsap.ticker.add(t => lenis.raf(t * 1000)); gsap.ticker.lagSmoothing(0); }
  else { const raf = t => { lenis.raf(t); requestAnimationFrame(raf); }; requestAnimationFrame(raf); }
}
function goTo(id) { const el = document.getElementById(id); if (!el) return; if (lenis) lenis.scrollTo(el, { offset: -80, duration: 1.3 }); else el.scrollIntoView({ behavior: 'smooth' }); }
document.querySelectorAll('[data-go]').forEach(a => a.addEventListener('click', e => { e.preventDefault(); goTo(a.dataset.go); }));
// nav scrolled
const nav = document.getElementById('nav');
window.addEventListener('scroll', () => nav.classList.toggle('scrolled', window.scrollY > 50), { passive: true });
// reveals (con stagger)
const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } }), { threshold: 0.12 });
document.querySelectorAll('.rv').forEach(el => io.observe(el));
// tilt 3D en tarjetas, magnético en botones
if (!reduced && !isMobile) {
  document.querySelectorAll('.tilt').forEach(el => {
    el.addEventListener('mousemove', e => { const r = el.getBoundingClientRect(); const px = (e.clientX - r.left) / r.width, py = (e.clientY - r.top) / r.height; el.style.transform = `perspective(1000px) rotateX(${(0.5 - py) * 6}deg) rotateY(${(px - 0.5) * 6}deg) translateZ(10px)`; });
    el.addEventListener('mouseleave', () => { el.style.transform = 'perspective(1000px) rotateX(0) rotateY(0)'; });
  });
  if (window.gsap) document.querySelectorAll('.magnetic').forEach(el => {
    el.addEventListener('mousemove', e => { const r = el.getBoundingClientRect(); gsap.to(el, { x: (e.clientX - (r.left + r.width / 2)) * 0.3, y: (e.clientY - (r.top + r.height / 2)) * 0.3, duration: 0.5, ease: 'power3.out' }); });
    el.addEventListener('mouseleave', () => gsap.to(el, { x: 0, y: 0, duration: 0.6, ease: 'elastic.out(1, 0.4)' }));
  });
  const logo = document.querySelector('.nav .logo');
  logo.addEventListener('mousemove', e => { const r = logo.getBoundingClientRect(); logo.style.transform = `perspective(1000px) rotateX(${(0.5 - (e.clientY - r.top) / r.height) * 12}deg) rotateY(${((e.clientX - r.left) / r.width - 0.5) * 12}deg)`; });
  logo.addEventListener('mouseleave', () => { logo.style.transform = 'none'; });
  logo.style.display = 'inline-block'; logo.style.transition = 'transform 0.3s cubic-bezier(.16,1,.3,1)';
}
// marquee reactivo al scroll (como el original)
(function () {
  if (reduced) return;
  const track = document.getElementById('mtrack'); let base = 0.5, vel = 0, last = window.scrollY, x = 0;
  const half = () => track.scrollWidth / 2;
  window.addEventListener('scroll', () => { const c = window.scrollY; vel = Math.min(8, Math.abs(c - last) * 0.3); last = c; }, { passive: true });
  const tick = () => { x -= base + vel; if (-x >= half()) x += half(); track.style.transform = `translateX(${x}px)`; vel *= 0.92; requestAnimationFrame(tick); };
  tick();
})();
// parallax hero (fantasma + esfera) y fantasma de auditoría
if (window.gsap && window.ScrollTrigger && !reduced) {
  const hero = document.querySelector('.hero');
  gsap.to('#ghost', { yPercent: -40, ease: 'none', scrollTrigger: { trigger: hero, start: 'top top', end: 'bottom top', scrub: true } });
  gsap.to('#sphere', { yPercent: 25, scale: 0.85, ease: 'none', scrollTrigger: { trigger: hero, start: 'top top', end: 'bottom top', scrub: true } });
  gsap.to('#aghost', { xPercent: -8, yPercent: -10, ease: 'none', scrollTrigger: { trigger: '.audit', start: 'top bottom', end: 'bottom top', scrub: true } });
  const fh = document.getElementById('finalh');
  ScrollTrigger.create({ trigger: fh, start: 'top 80%', once: true, onEnter: () => { const sp = new SplitType(fh, { types: 'chars,words' }); gsap.fromTo(sp.chars, { y: '100%', opacity: 0 }, { y: 0, opacity: 1, duration: 0.9, ease: 'expo.out', stagger: 0.02 }); } });
}
// esfera 3D (sol) — desactivada en móvil y reduced motion, con fallback estático
const sphereEl = document.getElementById('sphere');
if (!reduced && !isMobile && window.THREE) { try { initSphere(sphereEl); } catch (e) { sphereEl.classList.add('no3d'); } } else { sphereEl.classList.add('no3d'); }
// video
document.getElementById('cover').addEventListener('click', () => { const v = document.getElementById('player'); document.getElementById('vcard').classList.add('playing'); v.src = v.dataset.src; v.muted = false; v.play().catch(() => {}); });
document.getElementById('player').addEventListener('ended', () => { document.getElementById('vcard').classList.remove('playing'); });
// ---- Leads: a dónde van los datos ----------------------------------------------------
// Los datos van por POST (JSON) a LEADS.url: hoy es el Apps Script "SOLYN Leads" que guarda cada lead en la planilla
// "SOLYN — Leads" (Google Drive de Juan) y manda un email a info.solyn@gmail.com. El código del script está en leads-apps-script.gs.
// También acepta un Google Form (URL terminada en /formResponse + IDs entry.xxx en LEADS.map) o cualquier API que reciba JSON.
const LEADS = {
  // Apps Script "SOLYN Leads" (cuenta de Juan) → planilla "SOLYN — Leads" + email a info.solyn@gmail.com por cada lead
  url: 'https://script.google.com/macros/s/AKfycbwWSt7RCO0mLikXe8Z3T0hmL1CzS04pNWUuoxtni_1NTiw7snRQ3_yYeybIpItYL3noBw/exec',
  map: { nombre: '', apellido: '', email: '', telefono: '', source: '', lang: '', page: '' }, // solo se usa si url es un Google Form (/formResponse)
};
const LS = { get: k => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }, set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };
async function sendLead(data) {
  data = Object.assign({ lang, page: location.href, ts: new Date().toISOString() }, data);
  if (!LEADS.url) { const q = LS.get('solyn_leads_q') || []; q.push(data); LS.set('solyn_leads_q', q.slice(-20)); return false; }
  try {
    if (/formResponse/.test(LEADS.url)) {
      const body = new URLSearchParams();
      Object.keys(LEADS.map).forEach(k => { if (LEADS.map[k] && data[k] != null) body.append(LEADS.map[k], String(data[k])); });
      await fetch(LEADS.url, { method: 'POST', mode: 'no-cors', body });
      return true;
    }
    const r = await fetch(LEADS.url, { method: 'POST', body: JSON.stringify(data) });
    return r.ok;
  } catch (e) {
    try { await fetch(LEADS.url, { method: 'POST', mode: 'no-cors', body: JSON.stringify(data) }); return true; } catch (_) { return false; }
  }
}
// reintento de leads que quedaron en cola (si el endpoint no estaba configurado o no había conexión)
(async () => { if (!LEADS.url) return; const q = LS.get('solyn_leads_q') || []; if (!q.length) return; LS.set('solyn_leads_q', []); for (const d of q) await sendLead(d); })();

// ---- Popup del Playbook --------------------------------------------------------------
const lm = document.getElementById('lm'), lmfab = document.getElementById('lmfab'), lmform = document.getElementById('lmform');
let lmShown = false;
function lmOpen() { lm.classList.add('on'); lm.setAttribute('aria-hidden', 'false'); lmShown = true; lmfab.classList.remove('on'); if (lenis) lenis.stop(); document.body.style.overflow = 'hidden'; setTimeout(() => { const f = lmform.querySelector('input'); if (f && window.innerWidth > 900) f.focus(); }, 400); }
function lmClose() { lm.classList.remove('on'); lm.setAttribute('aria-hidden', 'true'); if (lenis) lenis.start(); document.body.style.overflow = ''; const st = LS.get('solyn_pb') || {}; if (!st.done) LS.set('solyn_pb', { closed: Date.now() }); setTimeout(() => lmfab.classList.add('on'), 600); }
document.getElementById('lmx').addEventListener('click', lmClose);
document.getElementById('lmback').addEventListener('click', lmClose);
document.addEventListener('keydown', e => { if (e.key === 'Escape' && lm.classList.contains('on')) lmClose(); });
lmfab.addEventListener('click', lmOpen);
(function autoShow() {
  const st = LS.get('solyn_pb') || {};
  if (new URLSearchParams(location.search).has('playbook')) { setTimeout(lmOpen, 600); return; }
  if (st.done || (st.closed && Date.now() - st.closed < 3 * 864e5)) { setTimeout(() => lmfab.classList.add('on'), 1500); return; }
  let fired = false; const fire = () => { if (fired || lmShown) return; fired = true; if (document.getElementById('vcard').classList.contains('playing')) { setTimeout(() => lmfab.classList.add('on'), 500); return; } lmOpen(); };
  const t = setTimeout(fire, 9000);
  const onScroll = () => { if (window.scrollY > window.innerHeight * 0.35) { clearTimeout(t); window.removeEventListener('scroll', onScroll); setTimeout(fire, 400); } };
  window.addEventListener('scroll', onScroll, { passive: true });
})();
function triggerDownload() { const a = document.getElementById('lmdl'); const tmp = document.createElement('a'); tmp.href = a.href; tmp.download = a.getAttribute('download'); document.body.appendChild(tmp); tmp.click(); tmp.remove(); }
lmform.addEventListener('submit', async e => {
  e.preventDefault(); const d = I18N[lang]; let ok = true; const data = {};
  lmform.querySelectorAll('input').forEach(i => { i.classList.remove('err'); i.removeAttribute('title'); const v = i.value.trim(); data[i.name] = v; let bad = !v; if (i.name === 'email' && v && !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v)) bad = true; if (i.name === 'telefono' && v && v.replace(/\D/g, '').length < 6) bad = true; if (bad) { ok = false; i.classList.add('err'); i.title = i.name === 'email' ? d.lm_err_mail : d.lm_err; } });
  if (!ok) { lmform.querySelector('.err').focus(); return; }
  const btn = document.getElementById('lmsubmit'); btn.disabled = true; btn.firstElementChild.textContent = d.lm_sending;
  await Promise.race([sendLead(Object.assign({ source: 'playbook' }, data)), new Promise(r => setTimeout(r, 3500))]);
  LS.set('solyn_pb', { done: Date.now(), email: data.email });
  document.getElementById('lmmain').hidden = true; document.getElementById('lmdone').hidden = false;
  triggerDownload();
  btn.disabled = false; btn.firstElementChild.textContent = d.lm_btn;
});
// newsletter → misma base de datos (source: newsletter)
document.getElementById('newsform').addEventListener('submit', async e => {
  e.preventDefault(); const f = e.target; const m = document.getElementById('newsmail').value.trim(); if (!m) return; const b = f.querySelector('button'); b.disabled = true;
  await Promise.race([sendLead({ email: m, source: 'newsletter' }), new Promise(r => setTimeout(r, 3500))]);
  b.disabled = false; f.reset(); let ok = f.parentElement.querySelector('.ok'); if (!ok) { ok = document.createElement('p'); ok.className = 'ok'; f.parentElement.appendChild(ok); } ok.textContent = I18N[lang].news_ok;
});
