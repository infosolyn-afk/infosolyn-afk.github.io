<style>/* SOLYN — Light mode tokens. Anaranjado SOLYN como acento, dark inversa para Guarantee. */
:root {
  --bg-primary: #F5F1EA;        /* cream base — saca lo naranja del logo */
  --surface-1: #ECE6DB;
  --surface-2: #E2DACB;
  --border: #1A1715;
  --border-soft: rgba(26,23,21,0.12);

  --text-primary: #1A1715;
  --text-secondary: #5C544C;
  --text-muted: #8C8278;

  --accent: #F26B1F;            /* naranja SOLYN principal */
  --accent-hot: #FF8A1F;        /* highlight más cálido */
  --accent-deep: #C44A0F;       /* sombra del sol */

  /* Inverso para sección Guarantee */
  --bg-inverse: #1A1715;
  --text-inverse: #F5F1EA;

  --font-display: 'Bebas Neue', Impact, sans-serif;
  --font-body: 'Syne', 'Helvetica Neue', sans-serif;
  --font-mono: 'DM Mono', 'Courier New', monospace;
}
</style>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg-primary); color: var(--text-primary); font-family: var(--font-body); font-weight: 300; font-size: 17px; line-height: 1.8; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
html { overflow-x: hidden; padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px); }
body { overflow-x: clip; padding: 0; }
img { max-width: none; }
::selection { background: var(--accent); color: #F5F1EA; }
a { color: inherit; text-decoration: none; }
.reveal { opacity: 0; transform: translateY(32px); transition: opacity 850ms cubic-bezier(.16,1,.3,1), transform 850ms cubic-bezier(.16,1,.3,1); }
.reveal.in { opacity: 1; transform: none; }
@media (max-width: 900px) {
  .nav-links { display: none !important; }
  .sphere-wrap { width: 210px !important; height: 210px !important; top: 36px !important; right: -50px !important; opacity: 0.6; }
  .cta-col { align-items: flex-start !important; flex-shrink: 1 !important; min-width: 0; max-width: 100%; }
  .cta-note { text-align: left !important; }
  .cta-row { flex-wrap: wrap !important; }
  .grid-3, .grid-2, .proof-grid { grid-template-columns: 1fr !important; }
  .acc-a { padding-left: 24px !important; }
  section { padding-left: 24px !important; padding-right: 24px !important; }
  nav { padding-left: 20px !important; padding-right: 20px !important; }
}
@media (max-width: 600px) {
  .proof-grid { grid-template-columns: 1fr 1fr !important; }
}
