<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SOLYN — v2 (en construcción)</title>
<meta name="robots" content="noindex">
<style>
  :root { --bg: #F5F1EA; --fg: #1A1715; --accent: #F26B1F; --muted: #8C8278; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); font-family: 'Syne', 'Helvetica Neue', Arial, sans-serif; }
  main { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 40px 24px; gap: 18px; }
  .sun { width: 72px; height: 72px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #FFB347 0%, #F26B1F 60%, #C44A0F 100%); }
  h1 { font-family: Impact, 'Bebas Neue', sans-serif; font-size: clamp(48px, 9vw, 96px); letter-spacing: 1px; margin: 0; line-height: 0.95; text-transform: uppercase; }
  h1 span { color: var(--accent); }
  p { max-width: 520px; color: var(--muted); font-size: 17px; line-height: 1.6; margin: 0; }
  a { color: var(--fg); }
</style>
</head>
<body>
<main>
  <div class="sun"></div>
  <h1>SOLYN <span>v2</span></h1>
  <p>Nueva versión del sitio, en construcción. La versión actual sigue publicada en <a href="../">infosolyn-afk.github.io</a>.</p>
</main>
</body>
</html>
