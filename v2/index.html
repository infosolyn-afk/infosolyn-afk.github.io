:root {
  --bg-0: #0a0a0a; --bg-1: #181410; --bg-2: #201b13;
  --fg: #fafafa; --muted: #a6a6a6; --dim: #6b6b6b;
  --accent: #F26B1F; --accent-hot: #FF8A1F; --accent-ink: #0a0a0a;
  --card: rgba(18,18,18,0.4); --line: rgba(255,255,255,0.08); --line-2: rgba(255,255,255,0.14);
  --head: 'Space Grotesk', sans-serif; --body: 'Inter', sans-serif; --label: 'Oswald', sans-serif;
  --container: 1152px;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
html, body { margin: 0; }
body { background: var(--bg-0) linear-gradient(135deg, #0a0a0a 0%, #181410 50%, #201b13 100%) fixed; color: var(--fg); font-family: var(--body); font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased; overflow-x: clip; }
html { overflow-x: hidden; }
a { color: inherit; text-decoration: none; }
img { max-width: 100%; display: block; }
.container { max-width: var(--container); margin: 0 auto; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); }
.accent { color: var(--accent); }
.label { font-family: var(--label); font-size: 14px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); }
h1, h2, h3 { font-family: var(--head); margin: 0; }
h2.big { font-size: 44px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; text-align: center; }
.sub { font-size: 20px; line-height: 1.6; color: var(--muted); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; height: 56px; padding: 0 48px; border-radius: 6px; font-family: var(--body); font-weight: 700; font-size: 18px; letter-spacing: 0.05em; text-transform: uppercase; background: var(--accent); color: var(--accent-ink); border: 0; cursor: pointer; transition: transform 200ms ease, background 200ms ease, box-shadow 200ms ease; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1), 0 4px 6px -4px rgba(0,0,0,0.1); white-space: nowrap; }
.btn:hover { background: var(--accent-hot); transform: translateY(-1px); }
.btn.outline { background: transparent; color: var(--accent); border: 1.6px solid var(--accent); height: 44px; padding: 0 40px; font-size: 16px; }
.btn.outline:hover { background: rgba(242,107,31,0.1); }
.btn.ghost { background: transparent; color: var(--fg); border: 1px solid var(--line-2); height: 52px; padding: 0 28px; font-size: 16px; text-transform: none; letter-spacing: 0; font-weight: 600; }
.btn.ghost:hover { background: rgba(255,255,255,0.05); }
.textlink { color: var(--fg); font-weight: 600; font-size: 16px; }
.textlink:hover { color: var(--accent); }
.card { background: var(--card); border: 0.8px solid var(--line); border-radius: 16px; padding: 32px; }
section { padding: 96px 0; }
.placeholder { outline: 1px dashed rgba(242,107,31,0.35); outline-offset: 4px; position: relative; }
.placeholder::after { content: attr(data-ph); position: absolute; top: -10px; right: 12px; font-family: var(--label); font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--accent); background: var(--bg-0); padding: 2px 8px; border-radius: 4px; }

/* nav */
.nav { position: fixed; top: 0; left: 0; right: 0; z-index: 50; background: rgba(10,10,10,0.8); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-bottom: 1px solid var(--line); }
.nav .in { height: 72px; display: flex; align-items: center; justify-content: space-between; gap: 24px; }
.nav .logo img { height: 34px; }
.nav .links { display: flex; align-items: center; gap: 28px; }
.nav .links a { font-size: 16px; font-weight: 500; color: var(--fg); opacity: 0.9; }
.nav .links a:hover { color: var(--accent); opacity: 1; }
.nav .right { display: flex; align-items: center; gap: 20px; }
.lang { display: inline-flex; gap: 6px; font-family: var(--label); font-size: 12px; letter-spacing: 0.15em; color: var(--dim); }
.lang button { background: none; border: 0; color: inherit; font: inherit; cursor: pointer; padding: 2px; }
.lang button.on { color: var(--accent); cursor: default; }

/* hero */
.hero { padding: 168px 0 48px; text-align: center; position: relative; }
.hero::before { content: ""; position: absolute; left: 50%; top: 40px; width: min(900px, 100vw); height: 520px; transform: translateX(-50%); background: radial-gradient(ellipse at center, rgba(242,107,31,0.14), transparent 62%); pointer-events: none; }
.hero .in { position: relative; display: flex; flex-direction: column; align-items: center; gap: 24px; }
.chip { display: inline-flex; align-items: center; padding: 6px 14px; border: 0.8px solid rgba(250,250,250,0.4); border-radius: 9999px; font-size: 16px; color: var(--fg); }
.hero h1 { font-size: 96px; line-height: 1; font-weight: 700; letter-spacing: -0.025em; text-transform: uppercase; display: flex; flex-direction: column; align-items: center; }
.hero h1 .l2 { color: var(--accent); position: relative; padding-bottom: 10px; }
.hero h1 .l2::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: var(--accent); border-radius: 2px; }
.hero .sub { max-width: 640px; }
.hero .ctas { display: flex; align-items: center; gap: 28px; flex-wrap: wrap; justify-content: center; margin-top: 8px; }
.hero .note { font-size: 13px; color: var(--dim); }
.proof { padding: 40px 0 24px; text-align: center; }
.proof .line { font-weight: 600; font-size: 16px; display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
.proof .line span.dot { color: var(--dim); }
.badges { display: flex; justify-content: center; gap: 12px; margin-top: 22px; }
.badge { width: 48px; height: 48px; border-radius: 10px; border: 1px solid var(--line-2); background: rgba(255,255,255,0.04); display: flex; align-items: center; justify-content: center; font-family: var(--label); font-size: 9px; letter-spacing: 0.1em; color: var(--dim); }
.proof .cap { margin-top: 14px; font-size: 14px; color: var(--muted); }

/* video */
.vsl { padding: 64px 0 56px; text-align: center; }
.vsl .label { margin-bottom: 22px; display: block; }
.vcard { position: relative; max-width: 960px; margin: 0 auto; aspect-ratio: 16 / 9; border-radius: 16px; overflow: hidden; background: #0e0d0c; border: 1px solid var(--line); box-shadow: 0 30px 80px rgba(0,0,0,0.5); }
.vcard .cover { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; cursor: pointer; background: radial-gradient(ellipse at 50% 85%, rgba(242,107,31,0.35), rgba(242,107,31,0.08) 40%, transparent 65%), linear-gradient(180deg, #121110, #0b0a09); }
.vcard .cover .brand { display: flex; align-items: center; gap: 10px; }
.vcard .cover .brand img { height: 26px; opacity: 0.9; }
.vcard .cover h3 { font-size: 44px; font-weight: 700; letter-spacing: -0.02em; }
.play { width: 96px; height: 96px; border-radius: 50%; background: var(--accent); border: 0; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 16px rgba(242,107,31,0.14), 0 0 60px rgba(242,107,31,0.55); transition: transform 200ms ease; }
.play:hover { transform: scale(1.06); }
.play::after { content: ""; width: 0; height: 0; border-top: 16px solid transparent; border-bottom: 16px solid transparent; border-left: 26px solid var(--accent-ink); margin-left: 6px; }
.avatars { display: flex; justify-content: center; margin-top: 10px; }
.avatars .av { width: 52px; height: 52px; border-radius: 50%; border: 2px solid var(--accent); background: linear-gradient(135deg, #2a2420, #3a3128); margin-left: -10px; display: flex; align-items: center; justify-content: center; font-family: var(--head); font-weight: 700; font-size: 14px; color: var(--muted); box-shadow: 0 0 0 2px #0e0d0c; }
.avatars .av:first-child { margin-left: 0; }
.vcard .cover .words { font-size: 16px; font-weight: 600; }
.vcard video { position: absolute; inset: 0; width: 100%; height: 100%; display: none; background: #000; }
.vcard.playing .cover { display: none; }
.vcard.playing video { display: block; }
.vsl .or { margin-top: 24px; font-size: 14px; color: var(--muted); }
.vsl .or a { color: var(--fg); text-decoration: underline; text-underline-offset: 3px; }

/* logos */
.logos { padding: 56px 0 72px; text-align: center; }
.logos h2 { font-size: 20px; font-weight: 500; letter-spacing: -0.01em; color: var(--muted); margin-bottom: 36px; }
.marquee { overflow: hidden; mask-image: linear-gradient(to right, transparent, #000 10%, #000 90%, transparent); -webkit-mask-image: linear-gradient(to right, transparent, #000 10%, #000 90%, transparent); }
.marquee .track { display: flex; gap: 72px; width: max-content; animation: slide 28s linear infinite; }
.marquee .track span { font-family: var(--head); font-weight: 700; font-size: 26px; color: #5a5a5a; white-space: nowrap; letter-spacing: -0.01em; }
@keyframes slide { from { transform: translateX(0); } to { transform: translateX(-50%); } }

/* testimonials */
.testi .label { text-align: center; display: block; margin-bottom: 36px; font-family: var(--label); text-transform: none; letter-spacing: 0; font-size: 16px; color: var(--fg); }
.featured { max-width: 760px; margin: 0 auto; text-align: center; }
.featured blockquote { margin: 0; font-family: var(--head); font-size: 30px; line-height: 1.35; font-weight: 500; letter-spacing: -0.01em; }
.person { display: flex; align-items: center; justify-content: center; gap: 14px; margin-top: 28px; }
.person .av { width: 56px; height: 56px; border-radius: 50%; background: linear-gradient(135deg, #2a2420, #3a3128); border: 1px solid var(--line-2); display: flex; align-items: center; justify-content: center; font-family: var(--head); font-weight: 700; color: var(--muted); }
.person .who { text-align: left; }
.person .name { font-weight: 600; font-size: 16px; }
.person .role { font-size: 14px; color: var(--muted); }
.tgrid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 24px; margin-top: 48px; }
.tcard { display: flex; flex-direction: column; justify-content: space-between; gap: 28px; }
.tcard p { margin: 0; font-size: 18px; line-height: 1.6; color: var(--muted); }
.tcard p b { color: var(--fg); font-weight: 600; }
.tcard .person { justify-content: flex-start; margin-top: 0; }
.tcard .person .av { width: 44px; height: 44px; }

/* why */
.why h2 { margin-bottom: 48px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
.icon { width: 48px; height: 48px; border-radius: 50%; border: 1px solid var(--line-2); display: flex; align-items: center; justify-content: center; margin-bottom: 24px; color: var(--fg); }
.icon svg { width: 22px; height: 22px; }
.why h3 { font-size: 20px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.35; margin-bottom: 10px; }
.why p { margin: 0; font-size: 18px; line-height: 1.55; color: var(--muted); }

/* how */
.how h2 { margin-bottom: 56px; }
.steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 32px; }
.step .num { display: flex; align-items: center; gap: 16px; margin-bottom: 22px; }
.step .num .c { width: 48px; height: 48px; border-radius: 50%; border: 1px solid var(--line-2); display: flex; align-items: center; justify-content: center; font-family: var(--head); font-weight: 600; font-size: 18px; flex-shrink: 0; }
.step .num .ln { flex: 1; height: 1px; background: var(--line-2); }
.step h3 { font-size: 24px; font-weight: 600; letter-spacing: -0.01em; margin-bottom: 10px; }
.step p { margin: 0; font-size: 18px; line-height: 1.55; color: var(--muted); }

/* audit */
.audit { text-align: center; }
.audit .label { display: block; margin-bottom: 18px; }
.audit .sub { max-width: 640px; margin: 20px auto 0; }
.acc { max-width: 760px; margin: 48px auto 0; text-align: left; display: flex; flex-direction: column; gap: 10px; }
.acc .it { border: 1px solid var(--line); border-radius: 12px; background: var(--card); overflow: hidden; transition: border-color 200ms; }
.acc .it.open { border-color: var(--line-2); background: rgba(255,255,255,0.03); }

function detectLang() {

  return 'en';
}
let lang = detectLang();

  document.querySelectorAll('[data-ph-i]').forEach(el => { el.placeholder = d[el.dataset.phI]; });
  document.querySelectorAll('.lang button').forEach(b => b.classList.toggle('on', b.dataset.lang === lang));
  document.getElementById('logotrack').innerHTML = [...d.logos, ...d.logos].map(x => `<span>${x}</span>`).join('');
  document.getElementById('acc').innerHTML = d.audit.map((it, i) => `<div class="it${i === 0 ? ' open' : ''}"><button aria-expanded="${i === 0}"><span class="n">0${i + 1}</span><span>${it[0]}</span><svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></button><div class="a"><p>${it[1]}</p></div></div>`).join('');
  document.querySelectorAll('#acc button').forEach(b => b.addEventListener('click', () => { const it = b.parentElement; const open = it.classList.contains('open'); document.querySelectorAll('#acc .it').forEach(x => { x.classList.remove('open'); x.querySelector('button').setAttribute('aria-expanded', 'false'); }); if (!open) { it.classList.add('open'); b.setAttribute('aria-expanded', 'true'); } }));
  document.title = lang === 'es' ? 'SOLYN | Convertimos el email en ingresos' : 'SOLYN | We turn email into revenue';
  // video source per language
  const v = document.getElementById('player'); const vc = document.getElementById('vcard');
  vc.classList.remove('playing'); v.pause(); v.removeAttribute('src'); v.load(); v.dataset.src = `video/solyn-${lang}.mp4`; v.poster = `video/solyn-${lang}-poster.jpg`;
}
document.querySelectorAll('.lang button').forEach(b => b.addEventListener('click', () => { lang = b.dataset.lang; try { localStorage.setItem('solyn_lang', lang); } catch (e) {} apply(); }));
